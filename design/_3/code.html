<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@100..900&amp;family=Plus+Jakarta+Sans:wght@100..900&amp;display=swap" rel="stylesheet"></head><body class="bg-gradient-to-br from-[#ebf5e9] to-[#d4e4cc] font-body-md text-on-surface min-h-screen flex flex-col items-center justify-center"><header class="mb-lg text-center flex flex-col items-center gap-sm mt-xl"><div class="w-16 h-16 bg-white rounded-full flex items-center justify-center shadow-sm mb-sm"><img alt="Serenity CRM Logo" class="w-10 h-10 object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLuAtQ05XAQUuQaddle2UxkeLtQ4VwqPPS8yKfnHZCsBn3uRF764piFtm_cxYdOBWS1Qr4XLpzuDTOb_tkdRcrId0CVhqTb_cpcVtI7gH381vOmvtCQWL2_Q3r-fEiBaR1ossbhGZ_kQYj_Gdc-FHgpt3Nqmv0GkyvjiNLvCkGbQ5kXJcCbsE-KabDFMKL9uw5LAss39g6p8MxN9V3-dHZ4dRVmG8HAeVoNnitYtab5rkQlutdWQkP-VbEIE"></div><h1 class="font-display-lg text-display-lg text-primary tracking-tight">Serenity CRM</h1><p class="font-body-md text-body-md text-on-surface-variant">Administrative Portal</p></header><main class="w-full max-w-[440px] px-margin-mobile"><div class="flex flex-col w-full items-center justify-center relative mb-xl">
<!-- Login Card -->
<div class="relative w-full max-w-[440px] bg-white rounded-[32px] shadow-[0_8px_30px_rgb(0,0,0,0.04)] p-lg z-10 animate-fade-in-up">
<!-- Header -->
<div class="text-center mb-lg">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Welcome Back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Please authenticate to continue</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-md" id="admin-login-form">
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface uppercase" for="email">Email Address</label>
<div class="relative flex items-center group">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant/50 group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full bg-[#f4f7f4] border-none rounded-2xl pl-[40px] pr-sm py-sm font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/40 focus:ring-2 focus:ring-primary/20 transition-all" id="email" name="email" placeholder="admin@serenitycrm.com" required="" type="email">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-on-surface uppercase" for="password">Password</label>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative flex items-center group">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant/50 group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full bg-[#f4f7f4] border-none rounded-2xl pl-[40px] pr-[40px] py-sm font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/40 focus:ring-2 focus:ring-primary/20 transition-all" id="password" name="password" placeholder="••••••••" required="" type="password">
<button class="absolute right-sm text-on-surface-variant/50 hover:text-on-surface transition-colors focus:outline-none" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-sm mt-xs">
<div class="relative flex items-center justify-center">
<input class="peer appearance-none w-[20px] h-[20px] rounded bg-[#f4f7f4] border-none checked:bg-primary transition-colors cursor-pointer outline-none focus-visible:ring-2 focus-visible:ring-primary/20" id="remember" name="remember" type="checkbox">
<span class="material-symbols-outlined absolute text-[16px] text-on-primary opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer select-none" for="remember">Keep me logged in</label>
</div>
<!-- Submit Button -->
<button class="mt-sm w-full bg-primary hover:bg-primary/90 text-on-primary font-label-md text-label-md py-4 rounded-2xl transition-all flex items-center justify-center gap-xs relative overflow-hidden group" type="submit">
<span class="relative z-10 flex items-center gap-xs">
                    Sign In to Dashboard
                    <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</span>
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/20 to-transparent translate-x-[-100%] group-hover:animate-shimmer"></div>
</button>
</form>
<!-- Footer / Version -->
<div class="mt-lg pt-md flex items-center justify-center border-t border-surface-variant/50">
<div class="text-center flex items-center justify-center gap-xs text-on-surface-variant/60">
<span class="material-symbols-outlined text-[16px]">verified_user</span>
<span class="font-label-sm text-label-sm">System Version 2.1.0</span>
</div>
</div>
</div>
</div>
<style>
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    .animate-fade-in-up {
        animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes shimmer {
        100% {
            transform: translateX(100%);
        }
    }
    .animate-shimmer {
        animation: shimmer 1.5s infinite;
    }
</style>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const togglePasswordBtn = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');
        const toggleIcon = togglePasswordBtn.querySelector('span');

        togglePasswordBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            toggleIcon.textContent = type === 'password' ? 'visibility_off' : 'visibility';
        });

        const form = document.getElementById('admin-login-form');
        const submitBtn = form.querySelector('button[type="submit"]');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Loading state
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span><span class="font-label-md text-label-md">Authenticating...</span>';
            submitBtn.style.pointerEvents = 'none';
            submitBtn.classList.add('opacity-90');

            // Simulate API call
            setTimeout(() => {
                // Restore state (in real app, this would redirect)
                submitBtn.innerHTML = '<span class="material-symbols-outlined text-[18px]">check_circle</span><span class="font-label-md text-label-md">Success</span>';
                submitBtn.classList.replace('bg-primary', 'bg-tertiary-container');
                submitBtn.classList.replace('text-on-primary', 'text-on-tertiary-container');
                
                setTimeout(() => {
                    submitBtn.innerHTML = originalText;
                    submitBtn.style.pointerEvents = 'auto';
                    submitBtn.classList.remove('opacity-90');
                    submitBtn.classList.replace('bg-tertiary-container', 'bg-primary');
                    submitBtn.classList.replace('text-on-tertiary-container', 'text-on-primary');
                }, 2000);
            }, 1500);
        });
    });
</script></main></body></html>
