"],"body-lg":["Noto Sans"],"body-sm":["Noto Sans"],"label-md":["Noto Sans"],"display-lg":["Plus Jakarta Sans"]},"fontSize":{"body-md":["16px",{"lineHeight":"24px","fontWeight":"400"}],"headline-lg":["32px",{"lineHeight":"40px","letterSpacing":"-0.01em","fontWeight":"600"}],"headline-sm":["20px",{"lineHeight":"28px","fontWeight":"600"}],"headline-md":["24px",{"lineHeight":"32px","fontWeight":"600"}],"label-sm":["12px",{"lineHeight":"14px","letterSpacing":"0.05em","fontWeight":"600"}],"body-lg":["18px",{"lineHeight":"28px","fontWeight":"400"}],"body-sm":["14px",{"lineHeight":"20px","fontWeight":"400"}],"label-md":["14px",{"lineHeight":"16px","letterSpacing":"0.05em","fontWeight":"600"}],"display-lg":["40px",{"lineHeight":"48px","letterSpacing":"-0.02em","fontWeight":"700"}]}}}}</script></head><body class="bg-background font-body-md text-on-surface"><header class="fixed top-0 w-full z-50 bg-surface-bright/60 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 max-w-7xl mx-auto px-6 lg:px-12 flex items-center justify-between"><div class="flex items-center gap-base"><span class="material-symbols-outlined text-primary text-[28px]">spa</span><span class="font-headline-sm text-headline-sm text-on-surface tracking-tight">Serenity Portal</span></div><nav class="hidden md:flex items-center gap-lg" data-active-classes="text-primary font-semibold underline decoration-2 underline-offset-8"><a aria-current="page" class="transition-colors text-primary font-semibold underline decoration-2 underline-offset-8" data-path="client-home" href="#">My Sessions</a><a class="text-label-md font-label-md text-on-surface-variant hover:text-primary transition-colors" data-path="resources" href="#">Resources</a><a class="text-label-md font-label-md text-on-surface-variant hover:text-primary transition-colors" data-path="messages" href="#">Messages</a></nav><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="w-full pt-16 bg-background"><div class="flex flex-col w-full min-h-[calc(100vh-64px)] items-center justify-center p-6 md:p-12 relative overflow-hidden">
<!-- Ambient Background Decor -->
<div class="absolute inset-0 pointer-events-none overflow-hidden">
<div class="absolute top-1/4 -left-1/4 w-[120%] h-[120%] rounded-full bg-gradient-to-tr from-surface-container via-surface-variant to-surface opacity-60 blur-3xl mix-blend-multiply animate-pulse" style="animation-duration: 8s;"></div>
<div class="absolute -bottom-1/4 -right-1/4 w-full h-full rounded-full bg-gradient-to-tl from-primary/10 via-surface-container-high to-transparent opacity-50 blur-3xl mix-blend-multiply animate-pulse" style="animation-duration: 12s;"></div>
</div>
<!-- Content Container -->
<div class="relative w-full max-w-2xl bg-surface-container-lowest/80 backdrop-blur-xl rounded-3xl shadow-[0_8px_32px_rgba(112,128,144,0.08)] border border-outline-variant/30 p-10 md:p-16 text-center z-10">
<!-- Animated Check Icon -->
<div class="relative w-24 h-24 mx-auto mb-8 flex items-center justify-center">
<div class="absolute inset-0 bg-primary-fixed rounded-full opacity-30 animate-ping" style="animation-duration: 3s;"></div>
<div class="absolute inset-0 bg-primary-fixed rounded-full shadow-[0_4px_16px_rgba(72,103,48,0.2)] flex items-center justify-center overflow-hidden">
<svg class="w-12 h-12 text-on-primary-fixed drop-shadow-md check-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path class="path-draw" d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" style="stroke-dasharray: 40; stroke-dashoffset: 40;"></path>
</svg>
</div>
</div>
<!-- Typography -->
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-4 tracking-tight">
      상담 신청이 완료되었습니다
    </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-lg mx-auto mb-10 leading-relaxed">
      마음을 내어주셔서 감사합니다.<br class="hidden sm:block">
      잠시 대기해 주시면 상담사가 배정되어 곧 안내해 드리겠습니다.
    </p>
<!-- Progress / Countdown Area -->
<div class="w-full max-w-md mx-auto bg-surface-container rounded-full h-2 mb-4 overflow-hidden relative shadow-inner">
<div class="absolute top-0 left-0 h-full bg-primary rounded-full transition-all ease-linear" id="progress-bar" style="width: 0%;"></div>
</div>
<p class="font-label-sm text-label-sm text-secondary mb-10 tracking-wider uppercase">
<span id="countdown-timer">5</span>초 후 처음 화면으로 이동합니다
    </p>
<!-- Action Button -->
<a class="inline-flex items-center justify-center px-8 py-4 bg-transparent border-2 border-primary/20 hover:border-primary text-primary hover:bg-primary hover:text-on-primary rounded-full font-label-md text-label-md transition-all duration-300 shadow-sm hover:shadow-md group" href="#client-home">
<span class="mr-2">처음 화면으로 즉시 이동</span>
<span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</a>
</div>
<style>
    @keyframes drawCheck {
      to {
        stroke-dashoffset: 0;
      }
    }
    .path-draw {
      animation: drawCheck 0.8s cubic-bezier(0.65, 0, 0.45, 1) forwards;
      animation-delay: 0.3s;
    }
  </style>
<script>
    document.addEventListener("DOMContentLoaded", () => {
      const duration = 5000;
      const interval = 50;
      let timeLeft = duration;
      const progressBar = document.getElementById("progress-bar");
      const timerDisplay = document.getElementById("countdown-timer");
      
      // Start progress bar animation right away
      progressBar.style.transition = `width ${duration}ms linear`;
      setTimeout(() => {
        progressBar.style.width = '0%';
      }, 50);

      const timer = setInterval(() => {
        timeLeft -= interval;
        const secondsLeft = Math.ceil(timeLeft / 1000);
        timerDisplay.textContent = secondsLeft;
        
        if (timeLeft <= 0) {
          clearInterval(timer);
          // Simulate redirect
          const btn = document.querySelector('a[href="#client-home"]');
          if(btn) {
              btn.classList.add('scale-95', 'opacity-50');
              setTimeout(() => {
                  window.location.hash = 'client-home';
                  // Dispatch event or logic for spa routing if needed
                  console.log("Redirecting to home...");
              }, 300);
          }
        }
      }, interval);
    });
  </script>
