<div class="absolute bottom-0 left-0 w-1/3 h-[400px] bg-tertiary-container/10 rounded-tr-[100px] -z-10 blur-2xl pointer-events-none"></div>

<h1 class="font-display-lg text-display-lg text-on-surface mb-sm tracking-tight">상담 질문지</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-lg">편안한 마음으로 답변해 주세요.
      </p>

<div class="flex flex-col">

</div>
</div>
<div class="flex flex-col items-end w-full md:w-auto">

</div>

<div class="absolute -right-20 -top-20 w-40 h-40 bg-primary/5 rounded-full blur-2xl group-hover:bg-primary/10 transition-colors duration-1000"></div>

<div class="flex flex-col gap-sm">
<label class="font-headline-md text-headline-md text-on-surface flex items-start gap-sm" for="q1">
<span class="text-primary font-headline-md">1.</span>

        </label>
<p class="font-body-sm text-body-sm text-on-surface-variant ml-[28px] mb-xs">간단한 키워드나 문장으로 작성해 주셔도 좋습니다.</p>
<div class="ml-[28px] relative group/input">
<input class="w-full bg-surface-container-low text-on-surface font-body-md p-md rounded-xl border border-outline-variant/30 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-300 placeholder:text-on-surface-variant/50" id="q1" placeholder="예: 직장 내 대인관계, 수면 문제 등" type="text">
</div>
</div>
<!-- Q2: Long Answer -->
<div class="flex flex-col gap-sm">
<label class="font-headline-md text-headline-md text-on-surface flex items-start gap-sm" for="q2">
<span class="text-primary font-headline-md">2.</span>

        </label>
<p class="font-body-sm text-body-sm text-on-surface-variant ml-[28px] mb-xs">기대하시는 변화나 목표가 있다면 자유롭게 적어주세요.</p>

</div>
</div>

<span class="font-label-sm text-label-sm text-on-surface-variant">매우 높음</span>

<div class="flex justify-between items-center gap-xs md:gap-sm bg-surface-container-low p-sm rounded-xl border border-outline-variant/30">

<div class="w-px h-6 bg-outline-variant/30 hidden md:block"></div>
<button class="flex-1 py-sm rounded-lg hover:bg-surface-container-high transition-colors text-on-surface-variant hover:text-primary font-headline-sm focus:bg-primary-container focus:text-on-primary-container border-2 border-transparent focus:border-primary/20">2</button>
<div class="w-px h-6 bg-outline-variant/30 hidden md:block"></div>
<button class="flex-1 py-sm rounded-lg hover:bg-surface-container-high transition-colors text-on-surface-variant hover:text-primary font-headline-sm focus:bg-primary-container focus:text-on-primary-container border-2 border-transparent focus:border-primary/20">3</button>
<div class="w-px h-6 bg-outline-variant/30 hidden md:block"></div>
<button class="flex-1 py-sm rounded-lg hover:bg-surface-container-high transition-colors text-on-surface-variant hover:text-primary font-headline-sm focus:bg-primary-container focus:text-on-primary-container border-2 border-transparent focus:border-primary/20">4</button>
<div class="w-px h-6 bg-outline-variant/30 hidden md:block"></div>
<button class="flex-1 py-sm rounded-lg hover:bg-surface-container-high transition-colors text-on-surface-variant hover:text-primary font-headline-sm focus:bg-primary-container focus:text-on-primary-container border-2 border-transparent focus:border-primary/20">5</button>
</div>
</div>
</div>
<!-- Q4: Multiple Choice -->
<div class="flex flex-col gap-sm">

        </label>

<label class="flex-1 cursor-pointer">

<span class="font-headline-sm text-headline-sm">예</span>
</div>
</label>
<label class="flex-1 cursor-pointer">
<input class="peer sr-only" name="prior_exp" type="radio">
<div class="flex items-center justify-center p-md rounded-xl border border-outline-variant/40 bg-surface-container-lowest hover:bg-surface-container-low transition-all peer-checked:border-primary peer-checked:bg-primary/5 peer-checked:text-primary text-on-surface-variant">
<span class="font-headline-sm text-headline-sm">아니오</span>

</label>
</div>
</div>
</div>

<div class="flex justify-between items-center mt-xl border-t border-outline-variant/20 pt-lg">
